name: Build macOS

# Gera o PACTO para Mac (Apple Silicon e Intel) em Macs do GitHub, testa o app empacotado
# e junta os arquivos de atualização (latest-mac.yml) num único artefato.
# Assinatura e notarização entram sozinhas quando os segredos da Apple existirem:
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY (conteúdo do .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # O build usa node_modules/electron/dist (electronDist); garante o Electron do Mac lá.
      - run: test -d node_modules/electron/dist/Electron.app || node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          else
            echo "Sem chave da Apple: o app sai sem notarização."
          fi
      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Segredo ausente chega como variável vazia, que o electron-builder tentaria usar.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do [ -z "${!name}" ] && unset "$name"; done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "Sem certificado: o app sai sem assinatura da Apple."; fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Smoke test the packaged app
        run: node scripts/mac-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/mac-smoke.png
          if-no-files-found: error

  feed:
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: node scripts/merge-mac-feed.mjs parts/mac-arm64/latest-mac.yml parts/mac-x64/latest-mac.yml > latest-mac.yml
      - run: mkdir mac && cp parts/*/*.dmg parts/*/*.zip parts/*/*.blockmap latest-mac.yml mac/
      - uses: actions/upload-artifact@v4
        with:
          name: pacto-mac
          path: mac/
