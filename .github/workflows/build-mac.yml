name: Build and publish releases

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPO: Mathpcastro/pacto-releases

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Prepare a hidden release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version."
            exit 1
          fi
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          draft=$(gh release view "$tag" --repo "$RELEASE_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ -n "$draft" ]]; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $tag is already public; refusing to replace it."
              exit 1
            fi
            echo "Continuing existing draft $tag."
          else
            base_tag=$(gh release view --repo "$RELEASE_REPO" --json tagName --jq '.tagName')
            if [[ -z "$base_tag" ]]; then
              echo "::error::Could not find a published release to anchor the new tag."
              exit 1
            fi
            target=$(gh api "repos/$RELEASE_REPO/git/ref/tags/$base_tag" --jq '.object.sha')
            gh release create "$tag" \
              --repo "$RELEASE_REPO" \
              --title "Carrossell $version" \
              --notes "Carrossell $version para Windows, Mac e Linux." \
              --draft \
              --target "$target"
          fi

  mac:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the Mac Electron binary is installed
        run: test -d node_modules/electron/dist/Electron.app || node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          else
            echo "Sem chave da Apple: o app sai sem notarização."
          fi
      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do [ -z "${!name}" ] && unset "$name"; done
          # Sem certificado, o app sai com assinatura ad-hoc completa. Sem ela, o pacote fica com a
          # assinatura do Electron quebrada pelas mudanças do empacotamento e o macOS pode recusar abrir.
          sign=()
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; sign=(-c.mac.identity=-); echo "Sem certificado: o app sai com assinatura ad-hoc, sem a da Apple."; fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never "${sign[@]}"
      - name: Smoke test the packaged app
        run: node scripts/mac-smoke.mjs
      - name: Upload Mac installers directly to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="release/Carrossell-${VERSION}-mac-${ARCH}.dmg"
          test -f "$dmg"
          if [[ "$ARCH" == "arm64" ]]; then
            alias_one="release/Carrossell-Mac-AppleSilicon.dmg"
            alias_two="release/PACTO-Mac-AppleSilicon.dmg"
          else
            alias_one="release/Carrossell-Mac-Intel.dmg"
            alias_two="release/PACTO-Mac-Intel.dmg"
          fi
          cp "$dmg" "$alias_one"
          cp "$dmg" "$alias_two"
          gh release upload "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --clobber \
            "$dmg" "$alias_one" "$alias_two"

  windows:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the Windows Electron binary is installed
        shell: pwsh
        run: |
          $electronBinary = "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path -LiteralPath $electronBinary)) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw "Could not download the Windows Electron binary." }
          }
          if (-not (Test-Path -LiteralPath $electronBinary)) { throw "Missing $electronBinary after install." }
      - run: npm test
      - run: npm run dist
      - name: Verify Windows updater files
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $installer = "release/Carrossell-Setup-$env:VERSION.exe"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing $installer" }
          if (-not (Test-Path -LiteralPath $blockmap)) { throw "Missing $blockmap" }
          $feed = Get-Content -Raw -LiteralPath "release/latest.yml"
          if ($feed -notmatch [regex]::Escape("Carrossell-Setup-$env:VERSION.exe")) { throw "latest.yml does not point to version $env:VERSION" }
      - name: Upload Windows installer and updater feed directly to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: pwsh
        run: |
          $installer = "release/Carrossell-Setup-$env:VERSION.exe"
          Copy-Item -LiteralPath $installer -Destination "release/Carrossell-Windows.exe"
          Copy-Item -LiteralPath $installer -Destination "release/PACTO-Windows.exe"
          gh release upload $env:RELEASE_TAG `
            --repo $env:RELEASE_REPO `
            --clobber `
            $installer `
            "$installer.blockmap" `
            "release/latest.yml" `
            "release/Carrossell-Windows.exe" `
            "release/PACTO-Windows.exe"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Windows release files." }

  linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the Linux Electron binary is installed
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder --linux deb --x64 --publish never
      - name: Verify Linux updater files
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          deb="release/Carrossell-${VERSION}-linux.deb"
          test -f "$deb"
          feed=$(cat release/latest-linux.yml)
          if ! grep -q "Carrossell-${VERSION}-linux.deb" <<<"$feed"; then
            echo "::error::latest-linux.yml does not point to version $VERSION"
            exit 1
          fi
          if ! grep -Eq "^version: ${VERSION}([[:space:]]|$)" <<<"$feed"; then
            echo "::error::latest-linux.yml version is not $VERSION"
            exit 1
          fi
      - name: Upload Linux installer and updater feed directly to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          deb="release/Carrossell-${VERSION}-linux.deb"
          cp "$deb" "release/Carrossell-Linux.deb"
          gh release upload "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --clobber \
            "$deb" \
            "release/latest-linux.yml" \
            "release/Carrossell-Linux.deb"

  publish:
    needs: [prepare-release, mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all platform assets before publishing
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name')
          required=(
            "Carrossell-Setup-${VERSION}.exe"
            "Carrossell-Setup-${VERSION}.exe.blockmap"
            "latest.yml"
            "Carrossell-Windows.exe"
            "PACTO-Windows.exe"
            "Carrossell-${VERSION}-mac-arm64.dmg"
            "Carrossell-${VERSION}-mac-x64.dmg"
            "Carrossell-Mac-AppleSilicon.dmg"
            "Carrossell-Mac-Intel.dmg"
            "PACTO-Mac-AppleSilicon.dmg"
            "PACTO-Mac-Intel.dmg"
            "Carrossell-${VERSION}-linux.deb"
            "Carrossell-Linux.deb"
            "latest-linux.yml"
          )
          for asset in "${required[@]}"; do
            if ! grep -Fxq "$asset" <<<"$assets"; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done

      - name: Publish the complete release as Latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json name,url,isDraft,assets --jq '{name,url,isDraft,assets:[.assets[].name]}'
